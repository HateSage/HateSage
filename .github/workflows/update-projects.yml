name: Update latest projects

on:
  schedule:
    - cron: "0 12 * * *"   # every day at 13:00 WAT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild projects table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_projects.py
      - name: Commit if changed
        run: |
          git config user.name "HATE bot"
          git config user.email "actions@github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update latest projects" && git push)